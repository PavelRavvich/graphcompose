name: CI

on:
  pull_request:
    branches: [dev, staging, production]
  push:
    branches: [dev, staging, production]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
